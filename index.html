<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trang Nhạc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #0f3460 !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: #e94560 !important; }

    .page-header {
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      padding: 80px 0 50px;
      text-align: center;
    }
    .page-header h1 { font-size: 2.5rem; font-weight: 700; }
    .page-header h1 span { color: #e94560; }

    /* PLAYER */
    .player-card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #ffffff15;
      border-radius: 20px;
      padding: 24px;
    }
    .yt-frame {
      width: 100%; aspect-ratio: 16/9;
      border-radius: 12px; border: none;
      box-shadow: 0 0 24px rgba(233,69,96,0.3);
    }

    /* PLAYLIST */
    .playlist-item {
      background: #ffffff08; border-radius: 10px; padding: 12px 16px;
      cursor: pointer; transition: 0.2s; border: 1px solid transparent;
    }
    .playlist-item:hover, .playlist-item.active {
      background: #e9456020; border-color: #e94560;
    }
    .playlist-item .track-num { color: #e94560; font-weight: 700; width: 24px; }
    .playlist-item .track-thumb {
      width: 60px; height: 45px; border-radius: 8px; object-fit: cover;
    }

    /* CATEGORIES */
    .cat-card {
      background: #ffffff08; border-radius: 12px; padding: 20px;
      text-align: center; cursor: pointer; transition: 0.3s;
      border: 1px solid #ffffff10;
    }
    .cat-card:hover { background: #e9456020; border-color: #e94560; transform: translateY(-3px); }
    .cat-card i { font-size: 2rem; color: #e94560; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-arrow-left me-2"></i>Về trang chủ</a>
    <div class="ms-auto d-flex gap-2">
      <a href="login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>
      <a href="register.html" class="btn btn-sm" style="background:#e94560;color:#fff">Đăng ký</a>
    </div>
  </div>
</nav>

<!-- HEADER -->
<div class="page-header">
  <h1><i class="bi bi-music-note-beamed me-2" style="color:#e94560"></i>Trang <span>Nhạc</span></h1>
  <p class="text-secondary mt-2">Thư giãn và tận hưởng âm nhạc cùng tôi</p>
</div>

<div class="container py-5">
  <div class="row g-4">

    <!-- PLAYER -->
    <div class="col-lg-6">
      <div class="player-card">
        <!-- YouTube iframe -->
        <iframe
          id="ytPlayer"
          class="yt-frame mb-3"
          src="https://www.youtube.com/embed/PD61lIYrG-M?enablejsapi=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
        <h5 class="fw-bold mb-1 text-center" id="trackTitle">Waiting For You</h5>
        <p class="text-secondary small text-center mb-0" id="trackArtist">MONO</p>
      </div>
    </div>

    <!-- PLAYLIST -->
    <div class="col-lg-6">
      <h5 class="fw-bold mb-3"><i class="bi bi-list-ul me-2 text-danger"></i>Danh sách phát</h5>
      <div class="d-flex flex-column gap-2" id="playlist"></div>
    </div>
  </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tracks = [
    {
      num: 1,
      title: "Waiting For You",
      artist: "MONO",
      videoId: "PD61lIYrG-M",
      thumb: "https://img.youtube.com/vi/PD61lIYrG-M/mqdefault.jpg"
    },
    {
      num: 2,
      title: "Tự Tâm",
      artist: "MONO",
      videoId: "sJt_i0hOugA",
      thumb: "https://img.youtube.com/vi/sJt_i0hOugA/mqdefault.jpg"
    },
  ];

  let currentTrack = 0;

  function renderPlaylist() {
    const pl = document.getElementById('playlist');
    pl.innerHTML = tracks.map((t, i) => `
      <div class="playlist-item d-flex align-items-center gap-3 ${i === currentTrack ? 'active' : ''}" onclick="selectTrack(${i})">
        <span class="track-num">${t.num}</span>
        <img src="${t.thumb}" class="track-thumb" alt="${t.title}" onerror="this.src='https://via.placeholder.com/60x45?text=♪'"/>
        <div class="flex-grow-1">
          <div class="fw-bold small">${t.title}</div>
          <div class="text-secondary" style="font-size:0.8rem">${t.artist}</div>
        </div>
        <i class="bi bi-${i === currentTrack ? 'play-circle-fill text-danger' : 'play-circle text-secondary'} fs-5"></i>
      </div>
    `).join('');
  }

  function selectTrack(i) {
    currentTrack = i;
    const t = tracks[i];
    document.getElementById('trackTitle').textContent = t.title;
    document.getElementById('trackArtist').textContent = t.artist;
    document.getElementById('ytPlayer').src =
      `https://www.youtube.com/embed/${t.videoId}?autoplay=1&enablejsapi=1`;
    renderPlaylist();
  }

  renderPlaylist();
</script>
</body>
</html>
